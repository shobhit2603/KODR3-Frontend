<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slack | AI Work Platform & Productivity Tools</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="shortcut icon" href="./assets/favicon.png" type="image/x-icon" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
</head>

<body>
  <main>
    <nav class="flex justify-between items-center px-5 py-3 md:py-5 md:px-10 lg:px-15 xl:px-40">
      <div class="flex items-center gap-10">
        <img src="./assets/Logo.png" alt="Logo" class="w-25" />
        <ul class="flex text-sm font-semibold gap-8 hidden lg:flex">
          <li>Features <i class="ri-arrow-down-s-line"></i></li>
          <li>Solutions <i class="ri-arrow-down-s-line"></i></li>
          <li>Enterprise</li>
          <li>Resources <i class="ri-arrow-down-s-line"></i></li>
          <li>Pricing</li>
        </ul>
      </div>
      <div class="flex gap-3 items-center">
        <button class="font-semibold text-sm hidden lg:block">Sign in</button>
        <button class="border text-[#611f69] rounded-sm text-sm px-4 py-3 font-semibold hidden 2xl:block">REQUEST A
          DEMO</button>
        <button class="bg-[#611f69] text-white font-semibold px-3 py-2 rounded-sm text-sm">
          GET STARTED
        </button>
        <button class="block lg:hidden"><i class="ri-menu-fill text-xl"></i></button>
      </div>
    </nav>

    <section class="flex flex-col items-center mx-5 mt-10 gap-3">
      <div class="mx-10 flex flex-col gap-3">
        <h1 class="text-3xl font-semibold text-center tracking-tight">
          Slack is your team's collective 🧠 brain.
        </h1>
        <p class="text- text-center">
          Move faster and work smarter with<br>people, apps, and AI at your side.
        </p>
      </div>
      <button class="bg-[#611f69] text-white font-medium rounded-xs py-4 w-full mt-3">
        GET STARTED
      </button>
      <button class="w-full text-[#611f69] font-medium border border-[#611f69] py-4 rounded-xs">
        FIND YOUR PLAN <i class="ri-arrow-right-line"></i>
      </button>
    </section>

    <section class="flex justify-between px-5 my-12 grayscale items-center">
      <img src="./assets/gm.png" alt="gm" class="h-4 sm:h-6" />
      <img src="./assets/openai.png" alt="openai" class="h-4 sm:h-6" />
      <img src="./assets/target.png" alt="target" class="h-4 sm:h-6" />
      <img src="./assets/paramount.png" alt="paramount" class="h-4 sm:h-6" />
      <img src="./assets/ibm.png" alt="ibm" class="h-4 sm:h-6" />
      <img src="./assets/stripe.png" alt="stripe" class="h-4 sm:h-6" />
      <img src="./assets/gm.png" alt="gm" class="h-4 sm:h-6 hidden sm:block" />
      <img src="./assets/openai.png" alt="openai" class="h-4 sm:h-6 hidden md:block" />
      <img src="./assets/target.png" alt="target" class="h-4 sm:h-6 hidden lg:block" />
    </section>

    <section class="mx-10 mt-20">
      <div>
        <h2 class="text-[#611f69] text-center text-lg font-semibold mb-5 tracking-tight">Plan launches</h2>
        <img src="./assets/C1.jpg" alt="C1" />
      </div>
    </section>
  </main>
</body>

</html>
