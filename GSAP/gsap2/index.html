<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP 2</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="p-5 bg-[#111]">
    <div class="flex flex-col container mb-5">
      <div class="box1 w-40 h-40 bg-red-500 rounded-lg mb-5 border-3 border-neutral-200"></div>
      <div class="box2 w-40 h-40 bg-green-500 rounded-lg mb-5 border-3 border-neutral-200"></div>
      <div class="box3 w-40 h-40 bg-blue-500 rounded-lg mb-5 border-3 border-neutral-200"></div>
      <div class="box4 w-40 h-40 bg-yellow-500 rounded-lg mb-5 border-3 border-neutral-200"></div>
    </div>
    <div class="controls text-white flex gap-5 justify-center items-center">
      <button class="play bg-neutral-900 px-4 py-2 rounded-lg cursor-pointer border border-purple-500">
        Play
      </button>
      <button class="pause bg-neutral-900 px-4 py-2 rounded-lg cursor-pointer border border-purple-500">
        Pause
      </button>
      <button class="reverse bg-neutral-900 px-4 py-2 rounded-lg cursor-pointer border border-purple-500">
        Reverse
      </button>
      <button class="restart bg-neutral-900 px-4 py-2 rounded-lg cursor-pointer border border-purple-500">
        Restart
      </button>
      <button class="seek bg-neutral-900 px-4 py-2 rounded-lg cursor-pointer border border-purple-500">
        Seek 0.5
      </button>
      <button class="slow bg-neutral-900 px-4 py-2 rounded-lg cursor-pointer border border-purple-500">
        Slow
      </button>
      <button class="normal bg-neutral-900 px-4 py-2 rounded-lg cursor-pointer border border-purple-500">
        Normal
      </button>
      <button class="fast bg-neutral-900 px-4 py-2 rounded-lg cursor-pointer border border-purple-500">
        Fast
      </button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
