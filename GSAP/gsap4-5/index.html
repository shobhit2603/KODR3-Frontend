<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading Screen Animation using GSAP</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div
      class="loader fixed top-0 left-0 z-50 flex justify-center items-center h-screen w-full bg-black"
    >
      <h1 class="text-white text-5xl tracking-tighter counter">0</h1>
    </div>

    <main class="min-h-screen w-full bg-zinc-950 flex flex-col image-container">
      <nav
        class="w-full flex justify-between items-center p-8 text-white bg-black/5 backdrop-blur-lg"
      >
        <div class="text-2xl font-bold tracking-tighter logo">KODR.</div>
        <div class="hidden md:flex gap-8 links">
          <a href="#" class="hover:text-zinc-300 transition-colors">Home</a>
          <a href="#" class="hover:text-zinc-300 transition-colors">Work</a>
          <a href="#" class="hover:text-zinc-300 transition-colors">About</a>
        </div>
        <button
          class="bg-white text-black px-6 py-2 rounded-full font-medium hover:bg-zinc-200 transition-colors btn cursor-pointer"
        >
          Contact
        </button>
      </nav>

      <div
        class="flex-1 flex flex-col justify-center items-center text-center px-4"
      >
        <div class="overflow-hidden">
          <h1
            class="text-7xl md:text-9xl font-medium text-white tracking-tighter title"
          >
            We Build
          </h1>
        </div>
        <div class="overflow-hidden mt-6">
          <p
            class="text-xl md:text-2xl text-white max-w-2xl font-light subtitle"
          >
            Crafting digital experiences that bridge the gap between design and
            development using GSAP.
          </p>
        </div>
      </div>
    </main>

    <section
      class="horizontal-section h-screen w-full flex flex-col justify-center overflow-hidden"
    >
      <div class="overflow-hidden">
        <h2
          class="text-5xl md:text-7xl font-medium text-white px-8 mb-10 tracking-tighter title2"
        >
          Our Latest Work
        </h2>
      </div>
      <div class="scroll-wrapper flex gap-8 px-8 w-[300vw] lg:w-[200vw]">
        <img
          src="./shooting-star-comet-night-sky-scenery-4k-wallpaper-uhdpaper.com-523@5@k.jpg"
          alt="Work 1"
          class="w-1/3 h-[40vh] md:h-[60vh] object-cover rounded-xl"
        />
        <img
          src="./cyberpunk-night-city-alley-4k-wallpaper-uhdpaper.com-817@5@m.jpg"
          alt="Work 2"
          class="w-1/3 h-[40vh] md:h-[60vh] object-cover rounded-xl"
        />
        <img
          src="./ninja-cyberpunk-night-city-sci-fi-4k-wallpaper-uhdpaper.com-832@5@m.jpg"
          alt="Work 3"
          class="w-1/3 h-[40vh] md:h-[60vh] object-cover rounded-xl"
        />
        <img
          src="./porsche-911-gt3-9504x5346-25773.jpeg"
          alt="Work 4"
          class="w-1/3 h-[40vh] md:h-[60vh] object-cover rounded-xl"
        />
      </div>
    </section>

    <section
      class="h-screen w-full flex flex-col justify-center items-start overflow-hidden wrapper-section"
    >
      <h1
        class="text-[30vw] font-medium px-8 mb-10 wrapper-text whitespace-nowrap bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent"
      >
        Learning GSAP from the Best.
      </h1>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll/bundled/locomotive-scroll.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
